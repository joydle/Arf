<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="How Arf works: a client calls arf-serve; the engine reuses shared prompts, batches conversations and drafts tokens; the GPU runs the step; tokens stream back."><title>How Arf works</title><rect x="250" y="20" width="400" height="76" rx="14" fill="#f6f7fa" stroke="#d5d9e3"/><text x="450.0" y="54.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">Your agent or app</text><text x="450.0" y="78.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">Claude Code · OpenCode · any OpenAI client</text><path d="M450 96 V138" stroke="#7d8599" stroke-width="1.6"/><path d="M445 136 L450 146 L455 136" fill="none" stroke="#7d8599" stroke-width="1.6"/><text x="464" y="126.0" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="13" fill="#7d8599">OpenAI · Anthropic API on localhost:8080</text><rect x="250" y="146" width="400" height="66" rx="14" fill="#f6f7fa" stroke="#d5d9e3"/><text x="450.0" y="185.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">arf-serve</text><path d="M450 212 V254" stroke="#7d8599" stroke-width="1.6"/><path d="M445 252 L450 262 L455 252" fill="none" stroke="#7d8599" stroke-width="1.6"/><rect x="20" y="262" width="860" height="230" rx="18" fill="#fbfbfd" stroke="#d5d9e3" stroke-dasharray="5 6"/><text x="44" y="296" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#7d8599">THE ENGINE — THREE WAYS OF NOT DOING WORK TWICE</text><rect x="44" y="318" width="252" height="150" rx="12" fill="#f6f7fa" stroke="#d5d9e3"/><text x="64" y="350" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#ff6e1e">01 REUSE</text><text x="64" y="382" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">Prefix cache</text><text x="64" y="414" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">Shared prompts and tools</text><text x="64" y="437" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">are read once.</text><rect x="324" y="318" width="252" height="150" rx="12" fill="#f6f7fa" stroke="#d5d9e3"/><text x="344" y="350" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#ff6e1e">02 SHARE</text><text x="344" y="382" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">Scheduler</text><text x="344" y="414" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">Conversations decode</text><text x="344" y="437" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">together, paged KV.</text><rect x="604" y="318" width="252" height="150" rx="12" fill="#f6f7fa" stroke="#d5d9e3"/><text x="624" y="350" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#ff6e1e">03 GUESS</text><text x="624" y="382" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">Draft, then verify</text><text x="624" y="414" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">Seven tokens proposed,</text><text x="624" y="437" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">checked in one pass.</text><path d="M450 492 V534" stroke="#7d8599" stroke-width="1.6"/><path d="M445 532 L450 542 L455 532" fill="none" stroke="#7d8599" stroke-width="1.6"/><rect x="250" y="542" width="400" height="76" rx="14" fill="#f6f7fa" stroke="#d5d9e3"/><text x="450.0" y="576.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#14171f">Native Metal kernels</text><text x="450.0" y="600.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" fill="#525a6e">the whole step on your Mac's GPU</text><path d="M650 580 H918 V58 H662" fill="none" stroke="#ff6e1e" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M670 53 L660 58 L670 63" fill="none" stroke="#ff6e1e" stroke-width="1.6"/><text x="938" y="390" text-anchor="middle" font-family="ui-monospace,SF Mono,Menlo,Consolas,monospace" font-size="13" fill="#ff6e1e" transform="rotate(-90 938 390)">tokens stream back</text></svg>
