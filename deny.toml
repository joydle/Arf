# cargo-deny configuration (used by `make deny` / `cargo deny check`).
#
# CI's blocking security gate is `cargo audit` (vulnerabilities). cargo-deny adds
# license, source, and duplicate-version governance for local/manual review.

[advisories]
version = 2
# Add RUSTSEC ids here (with a note) to acknowledge accepted advisories. Keep in step with
# .cargo/audit.toml.
ignore = [
    # rsa (Marvin timing attack), no fixed release; in Cargo.lock only via sqlx-mysql, which is
    # never compiled (sqlx is used with the `postgres` feature alone).
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses present across the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
# We legitimately pull two major versions of some crates transitively.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
